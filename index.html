<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="cabecalho">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">8º Ano — Ensino Fundamental</p>
      <p class="aluno-info">Estudante: <strong>Estudante Exemplo</strong></p>
    </header>

    <!-- Área Superior: Cards de Resumo -->
    <section class="cards-resumo">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="card-media-geral" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="card-total-faltas" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="card-bom-desempenho" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Precisa de Atenção</h3>
        <p id="card-atencao" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Frequência Geral</h3>
        <p id="card-frequencia" class="valor-card">92%</p>
        <span class="status-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Área da Tabela de Notas -->
    <main class="secao-tabela">
      <h2>Notas e Frequência por Disciplina</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas com as disciplinas serão inseridas aqui pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
